
<section class="container py-4">
  <h2 class="mb-4">Session Recap</h2>

  <div class="mb-3">
    <label for="notes" class="form-label">Session Notes</label>
    <textarea
      id="notes"
      class="form-control"
      rows="5"
      placeholder="Write your session notes here..."
      [ngModel]="notes()"
      (ngModelChange)="notes.set($event)"
    ></textarea>
  </div>

  <!-- Generate Recap Button -->
  <button
    type="button"
    class="btn btn-primary"
    (click)="generate()"
    [disabled]="loading() || !notes().trim()"
  >
    @if (loading()) {
      Generating Recap...
    } @else {
      Generate Recap
    }
  </button>

  <!-- Error Message -->
  @if (error()) {
    <div class="alert alert-danger mt-3">
      {{ error() }}
    </div>
  }

  <!-- Generated Recap -->
  @if (recap()) {
    <div class="card mt-4">
      <div class="card-body">
        <h3 class="h5 card-title">Generated Recap</h3>
        <p class="card-text" style="white-space: pre-wrap;">{{ recap() }}</p>
      </div>
    </div>
  }
</section>
